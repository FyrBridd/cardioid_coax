number = 1
title = "Cardioid first, then the front shape"
base = "params/default.toml"
trusted_limit_hz = 2851
trusted_note = "inherited from round 0's mesh check (2026-10-27)"
finals = 2

[[compare]]
label = "Round 0 (round 0b run)"
scores = "out/round0b/scores.json"

[[stage]]
name = "vents"
settings = "vents"
rank_by = "cardioid"
include_round0 = true
grid = { "vents.centre_from_front_mm" = [120, 160, 200, 240, 280], "vents.slots_per_side" = [6, 9, 12] }

# Every shape variant is applied on top of the vents stage's winner.
[[stage]]
name = "shape"
settings = "screen"
rank_by = "directivity"
include_round0 = true

[[stage.variant]]
name = "w330-sq-m290"
set = { "cabinet.width_mm" = 330 }

