[project]
name = "speaker"
version = "0.1.0"
description = "Parametric design pipeline for a cardioid coax floorstander"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "cadquery>=2.8",
    "ezdxf>=1.4",
    "bempp-cl>=0.4.2,<0.5",
    "pyopencl",
    "pocl-binary-distribution",
    "gmsh @ https://gmsh.info/python-packages-dev-nox/gmsh/gmsh-4.15.0.dev1+nox-py2.py3-none-manylinux_2_24_x86_64.whl",
]

[project.scripts]
speaker = "speaker.cli:main"

[dependency-groups]
dev = ["pytest", "pymupdf"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # gmsh no-X wheel: the PyPI wheel needs libGLU

[tool.hatch.build.targets.wheel]
packages = ["src/speaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["bem: runs the BEM solver (slow)"]
addopts = "-m 'not bem'"
filterwarnings = [
    # bempp-cl 0.4.2 imports LinearOperator from a deprecated scipy namespace.
    "ignore:Please import `LinearOperator`:DeprecationWarning:bempp_cl",
]
