[project]
name = "speaker"
version = "0.1.0"
description = "Parametric design pipeline for a cardioid coax floorstander"
requires-python = "==3.12.*"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "cadquery>=2.8",
    "ezdxf>=1.4",
]

[project.scripts]
speaker = "speaker.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speaker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
