# Round 1 recommendation (w330-sq-m290, docs/rounds/round-1.md). Lengths in mm, volumes in litres.
drivers_measured = false
coax = "bms_10c262"
bass = "dayton_rss265ho_44"

[cabinet]
width_mm = 330
depth_mm = 350
panel_t_mm = 18
coax_centre_z_mm = 950
top_margin_mm = 20
divider_t_mm = 18
flare_mouth_d_mm = 290
bass_centres_z_mm = [200, 520]
coax_chamber_net_volume_l = 16.5
outer_baffle_t_mm = 18     # the baffle is this outer layer plus one panel_t inner layer
front_edge = "square"      # square | roundover | chamfer | facets
edge_size_mm = 0           # roundover radius, or the 45° chamfer leg; 0 for square and facets
facet_angle_deg = 0        # facets: angle back from the front plane
facet_width_mm = 0         # facets: width of each facet, from the side edge inwards
facet_base_z_mm = 0        # facets: height where the facet starts (the bass section below stays flat)
facet_ramp_mm = 0          # facets: 0 = a horizontal step at the base; > 0 = a planar ramp this tall
coax_offset_x_mm = 0       # + towards +x, the listener's side; mirrored on the other cabinet
flare_profile = "ellipse"  # ellipse | cone

[vents]
slots_per_side = 9
slot_w_mm = 100
slot_h_mm = 10
slot_pitch_mm = 22
centre_from_front_mm = 120
specific_resistance_rayl = 114.76  # tuned by the model for 16.5 L / 18,000 mm2 (round 1, 2026-10-28)

[room]
length_x_mm = 4000
width_y_mm = 4600
height_z_mm = 2000
back_gap_mm = 75
speaker_y_mm = [960, 3460]
seat_mm = [3425, 2210, 950]

[drive]
amp_v_rms = 25.0
inductor_dcr_ohm = 0.4
active_v_rms = 40.0
